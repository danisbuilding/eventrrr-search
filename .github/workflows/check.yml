name: check
# Nightly end-to-end check of the live site: the page loads, meta answers, and a real question returns events.
# A failure emails the repo owner (GitHub's default for failed scheduled workflows).
on:
  schedule: [{cron: "17 13 * * *"}]   # 07:17 Mexico City
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Page
        run: curl -fsS https://search.eventrrr.com/ | grep -q "Eventrrr Search"
      - name: Meta
        run: curl -fsS https://search.eventrrr.com/api/meta | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['cities'], 'no cities'; print('updated', d.get('updated_at'))"
      - name: Search
        run: |
          curl -fsS -X POST https://search.eventrrr.com/api/search -H 'content-type: application/json' \
            -d '{"q":"things to do this week","filters":null}' \
          | python3 -c "import json,sys; d=json.load(sys.stdin); n=len(d['results']); print('results', n, 'parser', d['parser']); assert n > 0, 'no results'"
