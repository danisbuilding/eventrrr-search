name: check
# Nightly live check of search.eventrrr.com (tests/live/check.mjs): filter correctness, keywords, the page on a
# phone and desktop, and speed. The report replaces the body of the issue "Search live check"; screenshots and the
# raw results are kept as the run's artifact. A failing check fails the run (GitHub emails the repo owner).
on:
  schedule: [{cron: "17 13 * * *"}]   # 07:17 Mexico City
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tests/live/**', '.github/workflows/check.yml']

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Live check
        id: check
        run: node tests/live/check.mjs
      - name: Report to the issue
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -f tests/live/out/report.md ] || exit 0
          n=$(gh issue list --state all --search 'in:title "Search live check"' --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --title "Search live check" --body-file tests/live/out/report.md
          else
            gh issue edit "$n" --body-file tests/live/out/report.md
            [ "${{ steps.check.outcome }}" = "failure" ] && gh issue comment "$n" --body "Live check failed on $(date -u +%F). See the report above and run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-check, path: tests/live/out/, retention-days: 14 }
