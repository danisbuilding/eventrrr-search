name: deploy
# Every push to main: test, then publish public/ + functions/ to the Cloudflare Pages project "eventrrr-search".
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages · Edit), CLOUDFLARE_ACCOUNT_ID,
# OPENAI_API_KEY, SCOUT_IQ_PUBLISHABLE_KEY. Until they exist the job tests and then stops with a clear message.
on:
  push: {branches: [main]}
  workflow_dispatch:

concurrency: {group: pages-deploy, cancel-in-progress: true}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: eventrrr-search
      DOMAIN: search.eventrrr.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test

      - name: Check secrets
        id: check
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -z "${!s}" ] && missing="$missing $s"; done
          [ -z "${{ secrets.OPENAI_API_KEY }}" ] && missing="$missing OPENAI_API_KEY"
          [ -z "${{ secrets.SCOUT_IQ_PUBLISHABLE_KEY }}" ] && missing="$missing SCOUT_IQ_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then echo "::warning::Not deploying yet. Missing repo secrets:$missing"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Create the Pages project (first run only)
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler pages project create "$PROJECT" --production-branch main || echo "project exists"

      - name: Set runtime secrets
        if: steps.check.outputs.ok == 'true'
        run: |
          printf '{"OPENAI_API_KEY":"%s","SCOUT_IQ_PUBLISHABLE_KEY":"%s"}' "$OPENAI" "$IQ" > /tmp/secrets.json
          npx wrangler pages secret bulk /tmp/secrets.json --project-name "$PROJECT"
          rm /tmp/secrets.json
        env:
          OPENAI: ${{ secrets.OPENAI_API_KEY }}
          IQ: ${{ secrets.SCOUT_IQ_PUBLISHABLE_KEY }}

      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler pages deploy public --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Attach search.eventrrr.com (idempotent)
        if: steps.check.outputs.ok == 'true'
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
            --data "{\"name\":\"$DOMAIN\"}" | head -c 600; echo
          echo "DNS: CNAME search → $PROJECT.pages.dev at Spaceship"
