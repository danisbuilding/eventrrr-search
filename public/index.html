<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eventrrr Search</title>
  <meta name="description" content="Pick a day and what you're into, and find events worth going to. Save any of them to your Eventrrr calendar.">
  <meta name="theme-color" content="#FFFFFF">
  <meta property="og:title" content="Eventrrr Search">
  <meta property="og:description" content="Find events worth leaving the house for.">
  <meta property="og:image" content="https://search.eventrrr.com/assets/tiger-peek.webp">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Eventrrr Search home">
      <span class="wordmark">Event<span class="rrr">rrr</span></span>
      <span class="product">Search</span>
    </a>
    <nav class="nav">
      <button class="signin" id="signin-btn" type="button">Sign in to Eventrrr</button>
      <button class="avatar" id="avatar-btn" type="button" hidden aria-label="Account"></button>
    </nav>
  </header>

  <div class="layout" id="layout">
    <main id="main" class="main">
      <!-- The finder: When and What always, More and a small keyword box (app.js renders the options) -->
      <section id="home" class="home" aria-labelledby="headline">
        <button class="city" id="city-btn" type="button" aria-label="City">
          <span id="city-name">Mexico City</span>
        </button>
        <h1 id="headline" class="headline">&nbsp;</h1>
        <div class="bar-wrap home-bar finder-wrap">
          <div class="tiger" id="tiger" aria-hidden="true">
            <div class="tail-clip"><img class="tiger-tail" id="tiger-tail" src="/assets/tiger-tail.webp" alt="" width="160" height="462" hidden></div>
            <div class="tiger-body">
              <img class="tiger-peek" src="/assets/tiger-peek.webp" alt="" width="480" height="386">
              <img class="tiger-frame" id="tiger-wink" src="/assets/tiger-wink.webp" alt="" width="480" height="386" hidden>
              <img class="tiger-frame" id="tiger-snap" src="/assets/tiger-snap.webp" alt="" width="480" height="386" hidden>
              <svg class="snap-lines" viewBox="0 0 60 60"><path d="M30 18V4M42 22l9-9M18 22l-9-9M46 34h12"/></svg>
            </div>
          </div>
          <svg class="claws" aria-hidden="true" viewBox="0 0 300 60" preserveAspectRatio="none"><path d="M70 56L118 4"/><path d="M118 56L166 4"/><path d="M166 56L214 4"/></svg>
          <div class="finder" id="finder" role="group" aria-label="Find events">
            <div class="fbar">
              <div class="pills" id="f-pills" role="toolbar" aria-label="Filters"></div>
              <div class="kwrow">
                <form class="kw" id="kw-form" role="search">
                  <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
                  <label for="kw" class="sr">Keywords</label>
                  <input id="kw" name="kw" type="search" autocomplete="off" enterkeyhint="search" maxlength="60" placeholder="Keywords">
                  <button type="button" class="kw-x" id="kw-x" aria-label="Clear keywords" hidden><svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
                </form>
                <span class="m-only" id="f-more-m"></span>
              </div>
            </div>
            <div class="pop" id="f-pop" role="menu" hidden></div>
            <div class="frow fextra" id="f-extra" hidden></div>
          </div>
        </div>
        <div id="result-list" class="result-list" aria-live="polite"></div>
      </section>
    </main>

    <aside id="pane" class="pane" aria-label="Event details" hidden></aside>
  </div>

  <dialog id="sheet" class="sheet" aria-label="Event details"></dialog>
  <dialog id="signin" class="sheet signin-sheet" aria-label="Sign in to save"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
